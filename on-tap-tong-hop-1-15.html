<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HSK2 · Ôn tập tổng hợp Bài 1–15</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F4EE;--card:#FFFFFC;--g:#4E8A7E;--gd:#2F6B60;--gs:#E2EEEA;--gl:#B9D3CB;--seal:#B0281E;--ink:#25302D;--gray:#76817C;--line:#DCE2DA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);background-image:radial-gradient(900px 500px at 100% -5%,#E3EFEA 0%,transparent 60%),radial-gradient(700px 420px at -10% 30%,#EEF0E6 0%,transparent 60%);
  font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;font-size:17px}
.home{width:100%;max-width:520px;margin-bottom:12px}
.home a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);color:var(--gd);font-weight:700;font-size:15px;padding:8px 16px 8px 12px;border-radius:99px;text-decoration:none}
.box{position:relative;overflow:hidden;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(40,70,60,.10);padding:30px 26px 26px;text-align:center;isolation:isolate}
.box::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gl);border-radius:18px;pointer-events:none}
.box::after{content:"";position:absolute;inset:15px;border:1px solid var(--gs);border-radius:14px;pointer-events:none}
.bam{position:absolute;left:-14px;top:-10px;width:120px;opacity:.55;z-index:-1;pointer-events:none}
.df{position:absolute;right:26px;top:26px;width:52px;opacity:.7;z-index:-1;transform:rotate(14deg)}
.stamp{position:absolute;right:16px;bottom:14px;width:96px;opacity:.16;transform:rotate(-12deg);z-index:-1}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand img{width:62px;height:62px;object-fit:contain}
.brand b{font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--seal)}
.lock{width:76px;height:76px;margin:20px auto 8px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35),rgba(255,255,255,0) 45%),var(--gd);display:grid;place-items:center;position:relative;
  box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--gl),0 8px 18px rgba(40,70,60,.25)}
.lock::after{content:"";position:absolute;right:-2px;top:-2px;width:18px;height:18px;border-radius:4px;background:var(--seal);transform:rotate(12deg);box-shadow:0 0 0 3px var(--card)}
.lock svg{width:36px;height:36px;color:#F3F7F2}
.k{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;color:var(--gray);margin-top:8px}
h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:32px;line-height:1.25;margin:4px 0 8px;color:var(--seal)}
p{margin:6px 0;color:var(--gray);font-size:16px}
p b{color:var(--ink)}
.field{margin-top:18px}
input{width:100%;font:inherit;font-size:24px;letter-spacing:.14em;text-align:center;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--paper)}
input:focus{outline:none;border-color:var(--g);background:#fff;box-shadow:0 0 0 4px var(--gs)}
button.go{margin-top:14px;border:0;border-radius:99px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;padding:13px 40px;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;box-shadow:0 10px 22px rgba(47,107,96,.28);cursor:pointer}
button.go[disabled]{opacity:.6}
.msg{min-height:24px;margin-top:12px;font-weight:600;font-size:15.5px;color:var(--seal)}
.zalo{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:#E9E1CC;border:1px solid #D8CBA9;color:var(--ink);text-decoration:none;font-weight:700;border-radius:99px;padding:6px 14px;font-size:15px}
.who{margin-top:10px;font-size:14px;color:var(--gray)}
.who button{border:0;background:none;color:var(--gd);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.loading{margin-top:20px;font-weight:700;color:var(--gd)}
</style>
</head>

<script>
var UNIT="EXAM";
(function(){
const NOTE=`Bài tổng ôn tự mở khi bạn đã được mở đủ <b>15 bài</b>. Nhập <b>mã học viên</b> Thầy Vy đã gửi cho bạn.`;
const panel=document.getElementById("panel");
async function openLesson(){
  try{const html=await GY.decrypt(UNIT,document.getElementById("gy-data").textContent.trim());
    document.open();document.write(html);document.close();return true}
  catch(e){if(e.message==="old"){panel.innerHTML='<p class="msg">Trình duyệt quá cũ. Hãy cập nhật iOS / Safari / Chrome rồi mở lại.</p>';return true}return false}
}
const notOpen=n=>`Mã của <b>${n}</b> chưa được mở mục này. Liên hệ Thầy Vy để mở thêm.`;
function form(msg){
  const s=GY.rawSession();
  panel.innerHTML=`<p>${NOTE}</p>
   <div class="field"><input id="code" placeholder="XXXXXXXX" inputmode="numeric" autocomplete="off" spellcheck="false" value="${s&&s.code?s.code:""}"></div>
   <button class="go" id="go" type="button">Mở bài</button>
   <div class="msg" id="msg">${msg||""}</div>
   <a class="zalo" href="https://zalo.me/${window.GY_ZALO||""}" target="_blank" rel="noopener">💬 Zalo Thầy Vy ${window.GY_ZALO||""}</a>
   ${s&&s.name?`<div class="who">Đang dùng mã của <b>${s.name}</b> · <button type="button" id="out">Đổi mã</button></div>`:""}`;
  const go=document.getElementById("go"),inp=document.getElementById("code");
  const run=async()=>{go.disabled=true;go.textContent="Đang kiểm tra…";const r=await GY.login(inp.value);go.disabled=false;go.textContent="Mở bài";
    if(!r.ok){document.getElementById("msg").textContent=GY.ERR[r.error]||"Có lỗi, thử lại sau.";return}
    if(!GY.key(UNIT)){form(notOpen(r.name));return}
    panel.innerHTML='<div class="loading">Đang mở bài…</div>';if(!await openLesson())form("Không mở được bài, thử tải lại trang.")};
  go.addEventListener("click",run);inp.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  const out=document.getElementById("out");if(out)out.addEventListener("click",()=>{GY.logout();form()});
}
(async()=>{
  let s=GY.session();
  if(s){s=await GY.refresh(false)}
  if(s&&GY.key(UNIT)){if(await openLesson())return}
  const raw=GY.rawSession();
  form(raw&&new Date(raw.exp)<new Date()?GY.ERR.expired:(s&&!GY.key(UNIT)?notOpen(s.name):""));
})();
})();
</script>
</body>
</html>
